name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make setup
      - run: make sdk-check
      - run: make check
      - run: make smoke
      - run: make smoke-s3
      - run: make smoke-release
      - run: make smoke-scoped
      - name: Verify dependency lockfile
        run: git diff --exit-code -- manifest.toml sdk/javascript/package-lock.json

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make smoke-container
      - run: make proxy-check
      - run: make compose-smoke
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
