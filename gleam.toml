name = "highway"
version = "0.1.0"
description = "WebSocket streams with JWT capabilities and asynchronous S3 history"
target = "erlang"
gleam = ">= 1.19.0"
repository = { type = "github", user = "NisargIO", repo = "highway" }
internal_modules = ["highway/internal", "highway/internal/*"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
logging = ">= 1.5.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
